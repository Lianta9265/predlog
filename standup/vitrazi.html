<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Витраж НАВСТРЕЧУ и НА ВСТРЕЧУ</title>
<style>
body{
    background:#0b1026;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    margin:0;
    letter-spacing:0.04em;
    word-spacing:0.16em;
}

#game{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:90px;
    margin-top:36px;
    padding:0 30px 40px;
}

#vitraj{
    position:relative;
    width:500px;
    height:760px;
    flex:0 0 500px;
}

#vitraj img{
    width:500px;
    position:absolute;
    left:0;
    top:0;
}

#questionBox{
    width:620px;
    text-align:left;
    padding-top:14px;
}

button{
    padding:14px 24px;
    margin:8px;
    font-size:23px;
    line-height:1.35;
    cursor:pointer;
    border-radius:14px;
    border:none;
    letter-spacing:0.05em;
    word-spacing:0.18em;
}

.option{
    background:#1e2a66;
    color:white;
    min-width:230px;
}

#final{
    display:none;
    margin-top:28px;
    padding:18px 34px;
    background:red;
    color:#fff;
    font-size:28px;
    font-weight:bold;
}

#completeMessage{
    display:none;
    margin-top:18px;
    color:#ffe082;
    font-weight:bold;
    font-size:28px;
    letter-spacing:0.05em;
    word-spacing:0.2em;
}

h1{
    margin:28px 20px 0;
    font-size:40px;
    font-weight:700;
    letter-spacing:0.06em;
    word-spacing:0.22em;
}

#question{
    font-size:34px;
    line-height:1.55;
    margin:0 0 24px;
    letter-spacing:0.04em;
    word-spacing:0.2em;
}

#answers{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:20px;
}

#questionBox p{
    font-size:28px;
    line-height:1.5;
    letter-spacing:0.04em;
    word-spacing:0.2em;
}
</style>
</head>
<body>

<h1>Собери жаропрочный витраж для корабля Платона</h1>

<div id="game">

<div id="vitraj">
    <img src="каркас.png" alt="Каркас витража">
    <img src="1.png" class="piece" style="display:none;" alt="Фрагмент 1">
    <img src="2.png" class="piece" style="display:none;" alt="Фрагмент 2">
    <img src="3.png" class="piece" style="display:none;" alt="Фрагмент 3">
    <img src="4.png" class="piece" style="display:none;" alt="Фрагмент 4">
    <img src="5.png" class="piece" style="display:none;" alt="Фрагмент 5">
    <img src="6.png" class="piece" style="display:none;" alt="Фрагмент 6">
    <img src="7.png" class="piece" style="display:none;" alt="Фрагмент 7">
    <img src="8.png" class="piece" style="display:none;" alt="Фрагмент 8">
    <img src="9.png" class="piece" style="display:none;" alt="Фрагмент 9">
    <img src="10.png" class="piece" style="display:none;" alt="Фрагмент 10">
</div>

<div id="questionBox">
    <h3 id="question"></h3>
    <div id="answers"></div>
    <p>Собрано: <span id="score">0</span>/10</p>

    <button id="final">нажми ДАЛЕЕ</button>
</div>

{q:"Мы опоздали ___ с нашими зарубежными партнёрами.",a:["навстречу","на встречу"],correct:1},
{q:"Я очень рассчитывал ___ выпускников в этом году.",a:["навстречу","на встречу"],correct:1},
{q:"Мы выбежали из дома и бросились ___ весеннему дождю.",a:["навстречу","на встречу"],correct:0},
{q:"Лодка плыла ___ сильному течению реки.",a:["навстречу","на встречу"],correct:0},
{q:"Судьба часто идет ___ тем, кто проявляет упорство.",a:["навстречу","на встречу"],correct:0},
{q:"___ главы государства с журналистами пригласили только аккредитованную прессу.",a:["навстречу","на встречу"],correct:1},
{q:"Все приглашённые собрались вовремя ___ в актовом зале.",a:["навстречу","на встречу"],correct:1},
{q:"Мы повернули ___ компромиссу в этом сложном споре.",a:["навстречу","на встречу"],correct:0},
{q:"Виктор не пришёл ___, сославшись на занятость.",a:["навстречу","на встречу"],correct:1},
{q:"___, назначенную вчера, он решил не ходить.",a:["навстречу","на встречу"],correct:1},
{q:"Она первая сделала шаг ___.",a:["навстречу","на встречу"],correct:0},
{q:"Мы возлагали большие надежды ___ директоров.",a:["навстречу","на встречу"],correct:1},
{q:"Солнечные лучи пробивались сквозь тучи ___ новому дню.",a:["навстречу","на встречу"],correct:0},
{q:"___, которая вчера состоялась, пришли известные люди города.",a:["навстречу","на встречу"],correct:1},
{q:"Нам ___ выбежал вислоухий щенок.",a:["навстречу","на встречу"],correct:0},
{q:"___ с ними опаздывать нельзя.",a:["навстречу","на встречу"],correct:1},
{q:"Ветер дул ___, мешая идти по открытому полю.",a:["навстречу","на встречу"],correct:0},
{q:"Рассчитывать ___ в ближайшее время не приходится.",a:["навстречу","на встречу"],correct:1},
{q:"___ приключениям спешим, друзья!",a:["навстречу","на встречу"],correct:0},
{q:"Солнечные лучи пробивались сквозь тучи ___ новому дню.",a:["навстречу","на встречу"],correct:0}
];

let current = 0;
let score = 0;
let gameFinished = false;

const questionEl = document.getElementById("question");
const answersDiv = document.getElementById("answers");
const scoreEl = document.getElementById("score");
const finalBtn = document.getElementById("final");
const completeMessage = document.getElementById("completeMessage");
const applauseSound = document.getElementById("applauseSound");

const pieces = document.querySelectorAll(".piece");
let hiddenPieces = [...pieces];
let shownPieces = [];

function shuffleQuestions(){
    questions.sort(() => Math.random() - 0.5);
}

function loadQuestion(){
    if(gameFinished){
        questionEl.innerText = "Витраж собран!";
        answersDiv.innerHTML = "";
        return;
    }

    if(current >= questions.length){
        current = 0;
        shuffleQuestions();
    }

    const q = questions[current];
    questionEl.innerText = q.q;
    answersDiv.innerHTML = "";

    q.a.forEach((option, index) => {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.innerText = option;
        btn.onclick = () => checkAnswer(index);
        answersDiv.appendChild(btn);
    });
}

function checkAnswer(index){
    if(gameFinished) return;

    const q = questions[current];
    if(index === q.correct){
        addPiece();
    } else {
        removePiece();
    }

    if(gameFinished) return;

    current++;
    loadQuestion();
}

function addPiece(){
    if(hiddenPieces.length === 0) return;

    const randomIndex = Math.floor(Math.random() * hiddenPieces.length);
    const piece = hiddenPieces.splice(randomIndex, 1)[0];
    piece.style.display = "block";
    shownPieces.push(piece);
    score++;
    scoreEl.innerText = score;

    if(score === 10){
        finishGame();
    }
}

function removePiece(){
    if(shownPieces.length === 0 || gameFinished) return;

    const randomIndex = Math.floor(Math.random() * shownPieces.length);
    const piece = shownPieces.splice(randomIndex, 1)[0];
    piece.style.display = "none";
    hiddenPieces.push(piece);
    score--;
    scoreEl.innerText = score;
    finalBtn.style.display = "none";
    completeMessage.style.display = "none";
}

function finishGame(){
    gameFinished = true;
    questionEl.innerText = "Витраж собран!";
    answersDiv.innerHTML = "";
    completeMessage.style.display = "block";
    finalBtn.style.display = "inline-block";

    applauseSound.pause();
    applauseSound.currentTime = 0;
    applauseSound.volume = 1;
    const playPromise = applauseSound.play();
    if (playPromise && typeof playPromise.catch === "function") {
        playPromise.catch(() => {
            document.addEventListener("click", retryApplauseOnce, { once:true });
        });
    }
}

function retryApplauseOnce(){
    applauseSound.currentTime = 0;
    applauseSound.play().catch(() => {});
}

shuffleQuestions();
loadQuestion();
</script>

</body>
</html>
